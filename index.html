
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitudes de personal</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 14px;
      background: #f3f5f4;
      color: #24332e;
      font-family: Arial, sans-serif;
    }
    main {
      max-width: 560px;
      margin: auto;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 16px #00000012;
    }
    header {
      background: #234b3e;
      color: white;
      padding: 25px 22px;
    }
    header h1 { margin: 0 0 8px; font-size: 24px; }
    header p { margin: 0; color: #e0ebe5; }
    form { padding: 22px; }
    label {
      display: block;
      margin: 17px 0 7px;
      font-weight: bold;
      font-size: 14px;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5d0;
      border-radius: 7px;
      background: white;
      font: inherit;
    }
    textarea { min-height: 85px; resize: vertical; }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 7px;
      background: #234b3e;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .notice {
      padding: 0 22px 22px;
      color: #68766f;
      font-size: 12px;
      line-height: 1.5;
    }
    #turnoBox[hidden] { display: none; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Solicitudes de personal</h1>
    <p>Formulario de libranzas y turnos</p>
  </header>

  <form id="solicitudForm">
    <label for="nombre">Nombre y apellidos</label>
    <input id="nombre" name="nombre" required
      autocomplete="name" placeholder="Escribe tu nombre">

    <label for="tipo">Tipo de solicitud</label>
    <select id="tipo" name="tipo" required>
      <option value="">Selecciona una opción</option>
      <option value="Librar un día">Librar un día completo</option>
      <option value="Librar un turno">Librar un turno concreto</option>
    </select>

    <label for="fecha">Fecha solicitada</label>
    <input id="fecha" name="fecha" type="date" required>

    <div id="turnoBox" hidden>
      <label for="turno">Turno que deseas librar</label>
      <select id="turno" name="turno">
        <option value="">Selecciona el turno</option>
        <option value="Mañana">Mañana</option>
        <option value="Tarde">Tarde</option>
        <option value="Noche">Noche</option>
        <option value="Otro">Otro</option>
      </select>
    </div>

    <label for="motivo">Observaciones (opcional)</label>
    <textarea id="motivo" name="motivo"
      placeholder="Añade algún comentario si lo necesitas"></textarea>

    <button type="submit">Enviar solicitud</button>
  </form>

  <div class="notice">
    La solicitud deberá ser revisada por el responsable.
    Enviar el formulario no significa que la libranza esté aprobada.
  </div>
</main>

<script>
  const tipo = document.getElementById('tipo');
  const turnoBox = document.getElementById('turnoBox');
  const turno = document.getElementById('turno');
  const form = document.getElementById('solicitudForm');

  tipo.addEventListener('change', () => {
    const necesitaTurno = tipo.value === 'Librar un turno';
    turnoBox.hidden = !necesitaTurno;
    turno.required = necesitaTurno;
    if (!necesitaTurno) turno.value = '';
  });

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    alert('El formulario de prueba funciona, pero todavía no está conectado para guardar solicitudes. Lo configuraremos en el siguiente paso.');
  });
</script>
</body>
</html>
